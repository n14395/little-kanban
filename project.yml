name: LittleKanban
options:
  bundleIdPrefix: com.n14395
  createIntermediateGroups: true
  generateEmptyDirectories: false
  minimumXcodeGenVersion: "2.42.0"
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  LittleKanban:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources
        # The widget extension's own code. It sits under `Sources/` so that the
        # suite's source-tree rules — no unlocalised prose, no `Text(verbatim:)`
        # carrying words — apply to it like everything else, and it is excluded
        # here because it is compiled into `LittleKanbanWidgets` below. What the
        # two targets *share* is `Sources/Widgets/`, which stays in both.
        excludes:
          - "WidgetExtension"
          # The share extension's own code, for `WidgetExtension`'s reason: it
          # is under `Sources/` so the suite's source-tree rules apply to it,
          # and it is compiled into `LittleKanbanShare` below rather than here.
          # What the two targets *share* is `Sources/Capture/`, which stays in
          # both — the same arrangement `Sources/Widgets/` is.
          - "ShareExtension"
      - path: Resources/Assets.xcassets
      # The String Catalog every `String(localized:)` and `Text(_:comment:)` in
      # the app extracts into. `SWIFT_EMIT_LOC_STRINGS` above writes the
      # .stringsdata; the catalog is what a translator is handed — and a
      # catalogue that is in no target is a file on disk, with every
      # `String(localized:)` falling back to its key.
      - path: Resources/Localizable.xcstrings
      - path: Resources/Fonts
        type: folder
      # The completion chimes, as a folder for `FontCatalog`'s reason: the app
      # asks the bundle for `Sounds/completion-<name>.caf`, so the folder name
      # is part of the contract.
      - path: Resources/Sounds
        type: folder
      # The SF Symbol names the board icon picker browses, generated by
      # Tools/make-symbol-catalogue. A resource rather than a Swift literal
      # because it is 300KB of data with no code in it — see ``SymbolCatalog``,
      # which reads it out of `Bundle.main` on the first browse and nowhere
      # else. In the app's target only: neither extension has a picker in it.
      - path: Resources/SFSymbols.txt
      # Required-reason API declarations. A resource of the bundle rather than
      # a build setting: the App Store reads it out of the .app, and
      # notarization is happy either way.
      - path: Resources/PrivacyInfo.xcprivacy
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Little Kanban
        # **Stated, rather than left to `$(PRODUCT_NAME)`.** The two used to be
        # the same string because the product was called `Simple Kanban`, space
        # and all — which is what forced the module name to `Simple_Kanban` and
        # put a space in every TEST_HOST path. `PRODUCT_NAME` is `LittleKanban`
        # now, one word, so the filesystem and the module get a clean name; this
        # is the name a *person* reads, and macOS shows it in the app menu, the
        # Dock and Finder. Untied here so neither has to compromise for the
        # other, and `PackagingTests` holds both to what they say.
        CFBundleName: Little Kanban
        # Both come from the build settings below rather than being written
        # twice: a literal here drifts from MARKETING_VERSION the first time
        # anyone bumps it, and the About panel reads the plist.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 Nicholas Fay. All rights reserved."
        LSApplicationCategoryType: public.app-category.productivity
        # The asset-catalogue icon's name. actool writes it into the merged
        # plist on its own, but an iOS submission is rejected without it and
        # `UIImage(named:)` — which the About panel uses to show the icon back
        # to the user — only resolves an app icon that has one.
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        # The drag payloads in Sources/Model/TaskTransfer.swift. An exported
        # type the bundle does not declare is registered dynamically and
        # resolves to one that conforms to nothing.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.n14395.LittleKanban.task
            UTTypeDescription: Little Kanban Task
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.n14395.LittleKanban.subtask
            UTTypeDescription: Little Kanban Sub-task
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.n14395.LittleKanban.column
            UTTypeDescription: Little Kanban Column
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.n14395.LittleKanban.label
            UTTypeDescription: Little Kanban Label
            UTTypeConformsTo:
              - public.data
          # `.board-row` because the plain `.board` below is the document's.
          - UTTypeIdentifier: com.n14395.LittleKanban.board-row
            UTTypeDescription: Little Kanban Board Row
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.n14395.LittleKanban.view
            UTTypeDescription: Little Kanban Saved View
            UTTypeConformsTo:
              - public.data
          # The export/import document (6.2). JSON rather than opaque data, so
          # a .littlekanban file opens in a text editor without an argument.
          - UTTypeIdentifier: com.n14395.LittleKanban.board
            UTTypeDescription: Little Kanban Board
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - littlekanban
        # Markdown belongs to nobody here, so it is imported rather than
        # exported. Without this the Markdown export's save panel has no
        # extension to offer and writes a .txt.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Text
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
        # littlekanban://task/<uuid> — parsed by `TaskLink` (6.11). The code
        # that reads a URL is never handed one the bundle has not claimed.
        CFBundleURLTypes:
          - CFBundleURLName: com.n14395.LittleKanban.task-link
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - littlekanban
        # The activity Handoff and Spotlight continue. The system hands one over
        # only to a bundle that says it can take it.
        NSUserActivityTypes:
          - com.n14395.LittleKanban.task
        # What makes the board document the app's own: a .littlekanban file
        # takes the app's icon and opens here.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Little Kanban Board
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.n14395.LittleKanban.board
        # An opened board file is read and merged, never edited where it lies,
        # so it is read in place rather than copied into the app's Inbox — that
        # copy would be litter nothing here ever deletes. Declaring it also
        # silences the iOS build warning that an app owning a document type has
        # not said which of the two it does.
        LSSupportsOpeningDocumentsInPlace: true
        # The launch screen was an empty dict, which is legal and paints white —
        # a hard flash before a dark board. `LaunchBackground` is `--app` from
        # Palette in both schemes, so the launch image is the colour the first
        # frame lands on.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Landscape is unlocked on the phone (5.5): a two-up board is
        # genuinely useful, and PhoneRootView lays one out for the compact
        # vertical size class. No upside-down, matching Apple's own phone apps.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # CloudKit tells the app about another device's edit by pushing a
        # silent notification, and only an app that has asked for remote
        # notifications is woken to receive one. Without this the board still
        # syncs, but not until somebody launches it.
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_NAME: LittleKanban
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.LittleKanban
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The twenty-nine alternates the icon picker offers — nine of the ten
        # grounds plus one per preset theme, written by `Tools/make-app-icons`.
        # This is what makes `setAlternateIconName(_:)` able to find them by the
        # catalogue's own names; without it only `AppIcon` above is compiled in
        # and every alternate fails with "not found".
        #
        # **iOS only.** macOS has no alternate-icon API at all — the desk sets
        # its Dock icon at run time from the same drawing, see
        # `AppIconInstaller` — so on that side these would be twenty-nine
        # `.icns` files nothing can ever ask for, in an app that is downloaded
        # rather than installed from a store.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS[sdk=iphone*]: YES
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P52946XHRJ
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        # **Sync is on.** These three files carry the iCloud container
        # `iCloud.com.n14395.LittleKanban` and the push environment on top of
        # the sandbox keys; the App ID and the container are registered under
        # the team above, which is what `xcodebuild -allowProvisioningUpdates`
        # did the first time a build carrying them was signed. A build whose
        # team cannot reach that container fails to sign, and `./build.sh` with
        # it — the plain `Resources/LittleKanban.entitlements` is still there,
        # and pointing the macOS line back at it puts the app on the local
        # SwiftData store with sync off.
        #
        # The app does not take these lines on trust. `CloudKitEntitlement`
        # checks the running signature before `BoardSyncStore` names a
        # container, because asking for one the build was not signed for is not
        # an error anybody can catch — it is a trap on CoreData's own queue,
        # which is exactly how this app used to die on its second launch.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Resources/LittleKanban-CloudKit.entitlements
        # iOS gets its own file rather than sharing the Mac's: the sandbox keys
        # there are macOS-only, and only the iCloud pair is common. There is no
        # non-CloudKit iOS file because iOS needs no entitlement to run the
        # local store — the setting appears only when sync is switched on.
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Resources/LittleKanban-iOS-CloudKit.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Resources/LittleKanban-iOS-CloudKit.entitlements
        # macOS reads its own code signature and needs no flag. iOS has no
        # public API for that — `SecTask` is macOS-only — so it is told, here,
        # beside the entitlements file it has to agree with.
        #
        # **`iphoneos*`, not `iphone*`.** The wider spelling matches the
        # simulator too, and a simulator build is *never* entitled whatever the
        # lines above say — Xcode strips the entitlements dict to empty, which
        # `codesign -d --entitlements` on the built .app confirms. So the flag
        # there claims a container the process does not hold, which is the one
        # arrangement `CloudKitEntitlement` exists to prevent. Measured on an
        # iPhone 17 Pro simulator: the app asked for the container and CoreData
        # answered `CKAccountStatusNoAccount` rather than trapping, only because
        # no iCloud account was signed in on that device — sign one in and the
        # entitlement check is what is left to fail.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos*]: $(inherited) LITTLEKANBAN_CLOUDKIT
    dependencies:
      # Embedded into the app, which is the only way a widget extension ships:
      # the system finds it inside the bundle that owns it, and the App Group
      # they share is what lets it read anything. XcodeGen copies it into
      # `PlugIns/` on both platforms.
      - target: LittleKanbanWidgets
      # The share sheet, embedded for the same reason and on both platforms:
      # macOS puts it in the Share menu once Launch Services has seen the app,
      # iOS puts it in the share sheet. See `LittleKanbanShare` below.
      - target: LittleKanbanShare
    scheme:
      testTargets:
        - LittleKanbanTests
      gatherCoverageData: false

  # The widgets (macOS and iPadOS; the phone gets them too, because a widget
  # extension that supports iOS supports every iOS device and refusing to draw
  # on one would be a worse answer than drawing).
  #
  # **It shares source with the app rather than a framework.** The theme layer
  # is a dozen pure value types with no state and no dependencies, and compiling
  # them twice costs a second of build time; extracting them into a framework
  # would cost a dynamic library in the bundle, an embed phase, and an `import`
  # at the top of two hundred files. `Sources/Widgets/` is the shared vocabulary
  # written for this — the digest, the App Group, and the URL scheme — and it is
  # in both targets deliberately.
  #
  # `Resources/Fonts` is here for the same reason it is in the app: `FontCatalog`
  # registers what it finds in `Bundle.main`, which inside an extension is the
  # extension. Without them a widget wearing Spectral draws in the system serif,
  # which is the one difference a person would notice at a glance.
  LittleKanbanWidgets:
    type: app-extension
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources/WidgetExtension
      - path: Sources/Widgets
      - path: Sources/Theme
      # The five model types the theme layer asks about: a priority has a dot
      # colour, a due date has a chip, a column's load against its WIP limit has
      # a chip recipe, and a label has a chip rule. Nothing else from the model
      # crosses — the extension is handed answers, not a board.
      - path: Sources/Model/CalendarDay.swift
      - path: Sources/Model/ColumnLoad.swift
      - path: Sources/Model/DueDate.swift
      - path: Sources/Model/Priority.swift
      - path: Sources/Model/TaskLabel.swift
      # `String(localized:)` resolves against `Bundle.main`, which in here is
      # this bundle. A catalogue in the app's target only would leave every
      # string in every widget showing its own key.
      - path: Resources/Localizable.xcstrings
      - path: Resources/Fonts
        type: folder
    info:
      path: Resources/WidgetsInfo.plist
      properties:
        CFBundleDisplayName: Little Kanban
        # From the build settings for the app's reason, and they must *match*
        # the app's: a bundle whose embedded extension disagrees about either is
        # rejected at submission and refuses to install from a .dmg.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 Nicholas Fay. All rights reserved."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: LittleKanbanWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.LittleKanban.Widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        # An embedded extension is copied into the app rather than installed
        # beside it; without this the archive carries a second, loose copy.
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P52946XHRJ
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        # The App Group, and on macOS the sandbox that makes granting it
        # possible. There is no iCloud container here and no network client: the
        # extension reads one file the app wrote. See `Sources/Widgets/WidgetShare.swift`.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Resources/LittleKanbanWidgets.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Resources/LittleKanbanWidgets-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Resources/LittleKanbanWidgets-iOS.entitlements

  # The share sheet: text or a link from any app becomes an Inbox card.
  #
  # **It shares source with the app rather than a framework**, the way
  # `LittleKanbanWidgets` does and for the same reasons. What crosses is
  # `Sources/Capture/` — the capture, the rules that turn a payload into one,
  # and the folder in the App Group it is written to — plus the theme layer and
  # `Sources/Widgets/`, which is how the sheet knows the App Group's name and
  # reads the digest to wear the user's theme. It never opens the board file or
  # the record store; `CaptureInbox` says why at length.
  #
  # `Resources/Fonts` is here for the widgets' reason: `FontCatalog` registers
  # what it finds in `Bundle.main`, which inside an extension is the extension.
  LittleKanbanShare:
    type: app-extension
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources/ShareExtension
      - path: Sources/Capture
      - path: Sources/Widgets
      - path: Sources/Theme
      # The same five the widgets take, and for the same reason: the theme layer
      # asks these four value types for a colour, and `ColumnLoad` for a chip.
      - path: Sources/Model/CalendarDay.swift
      - path: Sources/Model/ColumnLoad.swift
      - path: Sources/Model/DueDate.swift
      - path: Sources/Model/Priority.swift
      - path: Sources/Model/TaskLabel.swift
      - path: Resources/Localizable.xcstrings
      - path: Resources/Fonts
        type: folder
    info:
      path: Resources/ShareInfo.plist
      properties:
        CFBundleDisplayName: Little Kanban
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 Nicholas Fay. All rights reserved."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          # `$(PRODUCT_MODULE_NAME).ShareViewController` — a Swift class is
          # named to ObjC by its module. Get this wrong and the share sheet
          # shows the extension and then fails to load it, with nothing in the
          # log that names this key.
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Text and one link. **No `SupportsWebPageWithMaxCount`**: that one
            # asks the system to run a JavaScript preprocessing file inside the
            # page, which is a whole extra artefact and a whole extra trust
            # question for a title this extension already gets from
            # `attributedContentText`.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_NAME: LittleKanbanShare
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.LittleKanban.Share
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        # An embedded extension is copied into the app rather than installed
        # beside it; without this the archive carries a second, loose copy.
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P52946XHRJ
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        # The App Group, and on macOS the sandbox that makes granting it
        # possible. No iCloud container and no network client: this bundle
        # writes one file into the group and the app drains it.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Resources/LittleKanbanShare.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Resources/LittleKanbanShare-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Resources/LittleKanbanShare-iOS.entitlements

  # A target of its own, and a scheme of its own, deliberately. Drag and drop
  # is the one interaction in this app that no unit test can reach: the store
  # calls behind it pass whether or not anything is wired to them, and a
  # screenshot cannot press. It runs on an iOS **simulator** only — driving the
  # host Mac's pointer fights whoever is using the machine, which is a lesson
  # this project learned the hard way and wrote down in the README.
  #
  #     xcodebuild test -scheme LittleKanbanUITests \
  #       -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4)'
  #
  # Out of the main scheme so `-scheme LittleKanban` keeps running exactly the
  # unit suites it always has, on both platforms, with no simulator needed.
  LittleKanbanUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: UITests
    dependencies:
      - target: LittleKanban
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.LittleKanbanUITests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P52946XHRJ
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: LittleKanban

  LittleKanbanTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Tests
    dependencies:
      - target: LittleKanban
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.LittleKanbanTests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P52946XHRJ
        TARGETED_DEVICE_FAMILY: "1,2"
        # XcodeGen derives the host path from the *target* name, which is
        # `LittleKanban` here only by coincidence — PRODUCT_NAME is what names the
        # bundle, and the executable sits in a different place on each platform.
        # Spelled out rather than inferred, so a PRODUCT_NAME change cannot
        # quietly leave the suite hosted on a bundle that is not there.
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/LittleKanban.app/Contents/MacOS/LittleKanban"
        TEST_HOST[sdk=iphone*]: "$(BUILT_PRODUCTS_DIR)/LittleKanban.app/LittleKanban"

schemes:
  LittleKanbanUITests:
    build:
      targets:
        LittleKanban: [run, test]
        LittleKanbanUITests: [test]
    test:
      targets:
        - LittleKanbanUITests
      gatherCoverageData: false
