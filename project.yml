name: SimpleKanban
options:
  bundleIdPrefix: com.n14395
  createIntermediateGroups: true
  generateEmptyDirectories: false
  minimumXcodeGenVersion: "2.42.0"
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  SimpleKanban:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      # The String Catalog every `String(localized:)` and `Text(_:comment:)` in
      # the app extracts into. `SWIFT_EMIT_LOC_STRINGS` above writes the
      # .stringsdata; the catalog is what a translator is handed — and a
      # catalogue that is in no target is a file on disk, with every
      # `String(localized:)` falling back to its key.
      - path: Resources/Localizable.xcstrings
      - path: Resources/Fonts
        type: folder
      # Required-reason API declarations. A resource of the bundle rather than
      # a build setting: the App Store reads it out of the .app, and
      # notarization is happy either way.
      - path: Resources/PrivacyInfo.xcprivacy
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Simple Kanban
        # Both come from the build settings below rather than being written
        # twice: a literal here drifts from MARKETING_VERSION the first time
        # anyone bumps it, and the About panel and the update check both read
        # the plist.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 Nicholas Fay. All rights reserved."
        LSApplicationCategoryType: public.app-category.productivity
        # The asset-catalogue icon's name. actool writes it into the merged
        # plist on its own, but an iOS submission is rejected without it and
        # `UIImage(named:)` — which the About panel uses to show the icon back
        # to the user — only resolves an app icon that has one.
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        # The drag payloads in Sources/Model/TaskTransfer.swift. An exported
        # type the bundle does not declare is registered dynamically and
        # resolves to one that conforms to nothing.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.n14395.SimpleKanban.task
            UTTypeDescription: Simple Kanban Task
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.n14395.SimpleKanban.subtask
            UTTypeDescription: Simple Kanban Sub-task
            UTTypeConformsTo:
              - public.data
          - UTTypeIdentifier: com.n14395.SimpleKanban.column
            UTTypeDescription: Simple Kanban Column
            UTTypeConformsTo:
              - public.data
          # The export/import document (6.2). JSON rather than opaque data, so
          # a .simplekanban file opens in a text editor without an argument.
          - UTTypeIdentifier: com.n14395.SimpleKanban.board
            UTTypeDescription: Simple Kanban Board
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - simplekanban
        # Markdown belongs to nobody here, so it is imported rather than
        # exported. Without this the Markdown export's save panel has no
        # extension to offer and writes a .txt.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Text
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
        # simplekanban://task/<uuid> — parsed by `TaskLink` (6.11). The code
        # that reads a URL is never handed one the bundle has not claimed.
        CFBundleURLTypes:
          - CFBundleURLName: com.n14395.SimpleKanban.task-link
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - simplekanban
        # The activity Handoff and Spotlight continue. The system hands one over
        # only to a bundle that says it can take it.
        NSUserActivityTypes:
          - com.n14395.SimpleKanban.task
        # What makes the board document the app's own: a .simplekanban file
        # takes the app's icon and opens here.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Simple Kanban Board
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.n14395.SimpleKanban.board
        # An opened board file is read and merged, never edited where it lies,
        # so it is read in place rather than copied into the app's Inbox — that
        # copy would be litter nothing here ever deletes. Declaring it also
        # silences the iOS build warning that an app owning a document type has
        # not said which of the two it does.
        LSSupportsOpeningDocumentsInPlace: true
        # The launch screen was an empty dict, which is legal and paints white —
        # a hard flash before a dark board. `LaunchBackground` is `--app` from
        # Palette in both schemes, so the launch image is the colour the first
        # frame lands on.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Where "Check for Updates" looks (7.6). In the bundle rather than in
        # code so a fork changes one line, and `./build.sh --publish` refuses to
        # release when this and the `origin` remote disagree — an installed copy
        # that polls the wrong repository never finds its own updates.
        SKUpdateRepository: n14395/simple-kanban
        SKReleasesPage: https://github.com/n14395/simple-kanban/releases/latest
        # Landscape is unlocked on the phone (5.5): a two-up board is
        # genuinely useful, and PhoneRootView lays one out for the compact
        # vertical size class. No upside-down, matching Apple's own phone apps.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # CloudKit tells the app about another device's edit by pushing a
        # silent notification, and only an app that has asked for remote
        # notifications is woken to receive one. Without this the board still
        # syncs, but not until somebody launches it.
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_NAME: Simple Kanban
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.SimpleKanban
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P52946XHRJ
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        # **Sync is on.** These three files carry the iCloud container
        # `iCloud.com.n14395.SimpleKanban` and the push environment on top of
        # the sandbox keys; the App ID and the container are registered under
        # the team above, which is what `xcodebuild -allowProvisioningUpdates`
        # did the first time a build carrying them was signed. A build whose
        # team cannot reach that container fails to sign, and `./build.sh` with
        # it — the plain `Resources/SimpleKanban.entitlements` is still there,
        # and pointing the macOS line back at it puts the app on the local
        # SwiftData store with sync off.
        #
        # The app does not take these lines on trust. `CloudKitEntitlement`
        # checks the running signature before `BoardSyncStore` names a
        # container, because asking for one the build was not signed for is not
        # an error anybody can catch — it is a trap on CoreData's own queue,
        # which is exactly how this app used to die on its second launch.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Resources/SimpleKanban-CloudKit.entitlements
        # iOS gets its own file rather than sharing the Mac's: the sandbox keys
        # there are macOS-only, and only the iCloud pair is common. There is no
        # non-CloudKit iOS file because iOS needs no entitlement to run the
        # local store — the setting appears only when sync is switched on.
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Resources/SimpleKanban-iOS-CloudKit.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Resources/SimpleKanban-iOS-CloudKit.entitlements
        # macOS reads its own code signature and needs no flag. iOS has no
        # public API for that — `SecTask` is macOS-only — so it is told, here,
        # beside the entitlements file it has to agree with.
        #
        # **`iphoneos*`, not `iphone*`.** The wider spelling matches the
        # simulator too, and a simulator build is *never* entitled whatever the
        # lines above say — Xcode strips the entitlements dict to empty, which
        # `codesign -d --entitlements` on the built .app confirms. So the flag
        # there claims a container the process does not hold, which is the one
        # arrangement `CloudKitEntitlement` exists to prevent. Measured on an
        # iPhone 17 Pro simulator: the app asked for the container and CoreData
        # answered `CKAccountStatusNoAccount` rather than trapping, only because
        # no iCloud account was signed in on that device — sign one in and the
        # entitlement check is what is left to fail.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos*]: $(inherited) SIMPLE_KANBAN_CLOUDKIT
    scheme:
      testTargets:
        - SimpleKanbanTests
      gatherCoverageData: false

  # A target of its own, and a scheme of its own, deliberately. Drag and drop
  # is the one interaction in this app that no unit test can reach: the store
  # calls behind it pass whether or not anything is wired to them, and a
  # screenshot cannot press. It runs on an iOS **simulator** only — driving the
  # host Mac's pointer fights whoever is using the machine, which is a lesson
  # this project learned the hard way and wrote down in the README.
  #
  #     xcodebuild test -scheme SimpleKanbanUITests \
  #       -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4)'
  #
  # Out of the main scheme so `-scheme SimpleKanban` keeps running exactly the
  # unit suites it always has, on both platforms, with no simulator needed.
  SimpleKanbanUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: UITests
    dependencies:
      - target: SimpleKanban
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.SimpleKanbanUITests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P52946XHRJ
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: SimpleKanban

  SimpleKanbanTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Tests
    dependencies:
      - target: SimpleKanban
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.n14395.SimpleKanbanTests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P52946XHRJ
        TARGETED_DEVICE_FAMILY: "1,2"
        # XcodeGen derives the host path from the target name; the app's
        # PRODUCT_NAME has a space in it, and the executable sits in a
        # different place on each platform.
        TEST_HOST[sdk=macosx*]: "$(BUILT_PRODUCTS_DIR)/Simple Kanban.app/Contents/MacOS/Simple Kanban"
        TEST_HOST[sdk=iphone*]: "$(BUILT_PRODUCTS_DIR)/Simple Kanban.app/Simple Kanban"

schemes:
  SimpleKanbanUITests:
    build:
      targets:
        SimpleKanban: [run, test]
        SimpleKanbanUITests: [test]
    test:
      targets:
        - SimpleKanbanUITests
      gatherCoverageData: false
